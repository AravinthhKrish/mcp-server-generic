apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-generic-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-server-generic
                port:
                  number: 80
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-server-generic
                port:
                  number: 80
